<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design Toolmap</title>
  <meta name="description" content="A map of 2D graphic design tools, organised by the stages of a design workflow.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Design Toolmap</h1>
    <p class="tagline">A map of 2D graphic design tools, organised by the stages of a design workflow.</p>
    <p class="summary" id="summary" aria-live="polite"></p>
  </header>

  <main>
    <div class="map" id="map"></div>
    <p class="message" id="message" role="status"></p>
    <noscript><p class="message">This page needs JavaScript to show the tools.</p></noscript>
  </main>

  <footer class="site-footer">
    <p>
      Inspired by
      <a href="https://github.com/goabstract/Awesome-Design-Tools" target="_blank" rel="noopener noreferrer">Awesome Design Tools</a>
      (MIT). Tool names and links are facts; descriptions are written from scratch.
    </p>
    <p>
      <a href="https://github.com/andang116-design/design-toolmap" target="_blank" rel="noopener noreferrer">View source and suggest a tool on GitHub</a>
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
